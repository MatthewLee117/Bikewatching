<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
    <script type="module" src="map.js"></script>
  </head>
  <body>
    <header>
      <h1>Bikewatching</h1>
      <p>
        Interactive geospatial visualization of Boston-area bike lanes and Bluebikes
        station traffic across the day.
      </p>
    </header>

    <section class="controls" aria-label="Traffic filter controls">
      <label for="time-slider">Filter trips by time:</label>
      <input id="time-slider" type="range" min="-1" max="1439" value="-1" step="1" />
      <time id="selected-time" datetime="all-day">Any time</time>
    </section>

    <div id="map" aria-label="Map of bike traffic"></div>

    <div class="legend flow-colors" aria-label="Traffic flow legend">
      <div style="--color: steelblue">More departures</div>
      <div style="--color: #9a7f57">Balanced</div>
      <div style="--color: darkorange">More arrivals</div>
    </div>
  </body>
</html>
